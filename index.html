
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>🐾👣开车汇总</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"Microsoft YaHei","PingFang SC",sans-serif;background:#fff5f7;color:#5a3e4b;line-height:1.6}
header{background:linear-gradient(135deg,#ffc2d1,#ffb3c6,#ff8fab);color:#fff;padding:28px 20px 22px;text-align:center;border-radius:0 0 24px 24px;box-shadow:0 6px 20px rgba(255,143,171,.28)}
header h1{font-size:22px;text-shadow:0 2px 6px rgba(200,80,120,.18)}
.stats{display:flex;justify-content:center;margin-top:14px}
.stat{background:rgba(255,255,255,.28);backdrop-filter:blur(6px);border-radius:14px;padding:6px 16px;font-size:13px;border:1px solid rgba(255,255,255,.4)}
.stat b{display:block;font-size:18px}
.bar{max-width:900px;margin:0 auto;padding:0 16px}
.search{margin-top:-18px;background:#fff;border-radius:16px;padding:10px 16px;box-shadow:0 4px 16px rgba(255,143,171,.16);border:2px solid #ffe0e9}
.search input{width:100%;border:none;outline:none;font-size:14px;color:#5a3e4b}
.tabs{display:flex;gap:8px;margin:18px 0 12px;flex-wrap:wrap;align-items:center}
.tab{background:#fff;border:2px solid #ffd6e0;border-radius:18px;padding:6px 14px;font-size:13px;color:#e07a96;cursor:pointer;font-weight:600}
.tab.active{background:linear-gradient(135deg,#ffc2d1,#ffb3c6);color:#fff;border-color:#ffb3c6}
.tab.add{border-style:dashed;color:#d9a7b7}
.tools{margin-left:auto;display:flex;gap:8px}
.btn{border:none;border-radius:14px;padding:7px 14px;font-size:13px;cursor:pointer;font-weight:600}
.btn-pink{background:#ff8fab;color:#fff;box-shadow:0 3px 10px rgba(255,143,171,.3)}
.btn-out{background:#fff;border:1.5px solid #ffd6e0;color:#e07a96}
.list{display:flex;flex-direction:column;gap:16px;padding-bottom:40px}
.card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 4px 14px rgba(255,143,171,.1);border:1.5px solid #ffe8ef;position:relative}
.badge{position:absolute;top:-9px;right:14px;background:#ff8fab;color:#fff;font-size:12px;padding:3px 10px;border-radius:12px;font-weight:700;box-shadow:0 2px 8px rgba(255,143,171,.3)}
.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:6px}
.card-head h3{font-size:16px;color:#4a2c3a;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tag{font-size:12px;background:#ffe0ec;color:#d65f8a;padding:3px 10px;border-radius:12px;font-weight:600}
.meta{font-size:13px;color:#8a6a76;display:flex;flex-wrap:wrap;gap:6px 18px;margin-bottom:4px}
.meta b{color:#5a3e4b}
.info{font-size:13px;color:#7a5a66;margin-bottom:2px}.info b{color:#d65f8a}
.img-box{width:100%;border-radius:14px;overflow:hidden;margin:10px 0;border:1.5px dashed #ffd6e0;background:#fffafb}
.img-box img{width:100%;height:auto;display:block;max-height:360px;object-fit:contain}
.img-row{display:flex;overflow-x:auto;gap:8px;padding:8px}
.img-row img{flex-shrink:0;width:200px;height:auto;border-radius:10px}
table{width:100%;border-collapse:separate;border-spacing:0;margin-top:10px;font-size:13px;border-radius:12px;overflow:hidden;border:1.5px solid #ffe0e9}
th{background:linear-gradient(135deg,#fff0f5,#ffe8ef);color:#d65f8a;padding:9px 6px;font-weight:700;text-align:center}
td{padding:8px 6px;text-align:center;border-top:1px solid #fff0f5}
tfoot td{border-top:2px solid #ffc2d1;background:#fff5f8;font-weight:700;color:#d65f8a}
.foot{font-size:12px;color:#c9a0ad;margin-top:10px;background:#fff5f8;padding:7px 12px;border-radius:10px;display:inline-block}
.empty{text-align:center;color:#d9a7b7;padding:50px 0}
.footer{text-align:center;padding:20px;color:#d9a7b7;font-size:12px}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(90,62,75,.35);z-index:99;justify-content:center;align-items:flex-start;padding:40px 16px;overflow-y:auto}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:20px;padding:24px;width:100%;max-width:560px;box-shadow:0 12px 40px rgba(0,0,0,.15)}
.modal h2{font-size:18px;color:#d65f8a;margin-bottom:16px}
.row{display:flex;gap:10px;margin-bottom:10px}
.row label{display:block;font-size:13px;color:#8a6a76;margin-bottom:3px}
.row input,.row select,.row textarea{width:100%;border:1.5px solid #ffd6e0;border-radius:10px;padding:8px 10px;font-size:14px;color:#5a3e4b;outline:none;background:#fffafb}
.row textarea{resize:vertical;min-height:50px}
.craft-row{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.craft-row input{width:100%;border:1.5px solid #ffe0e9;border-radius:8px;padding:6px 8px;font-size:13px}
.craft-row .del{background:#ffd1dc;border:none;border-radius:8px;width:30px;height:30px;cursor:pointer;color:#d65f8a;font-weight:700}
.modal-btns{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.hint{font-size:12px;color:#c9a0ad;margin-top:4px}
.sync-hint{font-size:12px;color:#d9a7b7;text-align:center;margin-top:6px}
.actions{display:flex;gap:8px;margin-top:12px;justify-content:flex-end}
.actions button{border:none;border-radius:10px;padding:6px 16px;font-size:13px;cursor:pointer;font-weight:600}
.btn-edit{background:#ffe0ec;color:#d65f8a;border:1.5px solid #ffd6e0!important}
.btn-del{background:#fff0f0;color:#d65f5f;border:1.5px solid #ffd6d6!important}
</style>
</head>
<body>
<header>
  <h1>🐾👣开车汇总</h1>
  <div class="stats">
    <div class="stat"><b id="sCars">0</b>车</div>
  </div>
</header>
<div class="bar">
  <div class="search"><input id="kw" placeholder="搜车名 / 系列 / 工厂 / 工艺 / 状态..."></div>
  <div class="tabs" id="tabs"></div>
  <div class="list" id="list"></div>
  <div class="sync-hint" id="syncHint"></div>
</div>
<div class="footer">
  <span id="adminStatus"></span>
  <span id="adminBtn" style="cursor:pointer;color:#ff8fab;text-decoration:underline;display:none;" onclick="promptPassword()">管理员登录</span>
  <span id="logoutBtn" style="cursor:pointer;color:#ff8fab;text-decoration:underline;display:none;" onclick="logoutAdmin()">[退出管理员]</span>
</div>

<div class="modal-bg" id="modal">
<div class="modal">
  <h2 id="modalTitle">添加新车</h2>
  <div class="row">
    <div style="flex:1"><label>系列（可直接输入新系列名）</label><input id="fSeries" list="dlSeries" placeholder="选或输入"><datalist id="dlSeries"></datalist></div>
    <div style="flex:1"><label>状态</label><select id="fStatus"><option>未开始</option><option>宣车中</option><option>打样中</option><option>大货制作中</option><option>已结束</option></select></div>
  </div>
  <div class="row"><label>车名</label><input id="fName" placeholder="例：祈星•会给你添麻烦吗"></div>
  <div class="row">
    <div style="flex:1"><label>工厂</label><input id="fFactory" placeholder="例：廉价"></div>
    <div style="flex:1"><label>均摊方式</label><select id="fMode"><option>个数</option><option>人头</option></select></div>
  </div>
  <div class="row">
    <div style="flex:1"><label>成团收款</label><input id="fPay" placeholder="2026/8/3"></div>
    <div style="flex:1"><label>大货完成</label><input id="fFinish" placeholder="留空暂不填"></div>
  </div>
  <div class="row"><label>工艺明细</label><input id="fSpec" placeholder="本体：背景渐变镂空透+丝印白色..."></div>
  <div class="row"><label>打样图链接（每行一个，可空）</label><textarea id="fImg" rows="3" placeholder="https://i.ibb.co/xxx/a.jpg&#10;https://i.ibb.co/yyy/b.jpg"></textarea></div>
  <div class="row">
    <div style="flex:1"><label>模具打样费</label><input id="fMold" type="number" value="0"></div>
    <div style="flex:1"><label>稿费</label><input id="fArt" type="number" value="0"></div>
  </div>
  <label style="font-size:13px;color:#8a6a76">工艺明细行（名称 / 售出 / 均摊 / 大货）</label>
  <div id="fCrafts"></div>
  <div class="row" style="margin-top:8px"><label>备注</label><textarea id="fNote"></textarea></div>
  <div class="modal-btns">
    <button class="btn btn-out" onclick="closeModal()">取消</button>
    <button class="btn btn-pink" onclick="addCraftRow()">+ 加工艺行</button>
    <button class="btn btn-pink" onclick="saveCar()">保存</button>
  </div>
</div>
</div>

<script>
const DATA_URL='./data.json';
const DEFAULT={series:['奇迹梦梦','all梦','祈星','其他'],cars:[
  {series:'祈星',name:'祈星•会给你添麻烦吗',status:'打样中',factory:'廉价',mode:'个数',
   payDate:'2026/8/3',finishDate:'',spec:'本体：背景渐变镂空透+丝印白色；特典：镂空透不加渐变，丝印蓝改黄',
   images:[],moldFee:450,artFee:40,note:'',crafts:[
     {name:'本体1（黄白渐变）',qty:19,avg:11.4,ship:22},
     {name:'本体2（黄粉渐变）',qty:21,avg:11.4,ship:22},
     {name:'特典',qty:5,avg:0,ship:16}]
  }
]};

let SERIES=[],CARS=[],tab='全部',isAdmin=false,loaded=false,editIndex=-1;
function apply(d){SERIES=d.series.slice();CARS=d.cars.map(c=>({crafts:[],images:[],...c}));}
apply(DEFAULT);
// 默认只读模式，管理员需输入密码进入
isAdmin = sessionStorage.getItem('kc_admin') === 'true';
// 如果URL带了 ?view=1 参数，强制只读
if(location.search.includes('view=1')) isAdmin = false;

async function init(){
  try{const r=await fetch(DATA_URL+'?_='+Date.now());if(r.ok){const d=await r.json();if(d&&d.cars){apply(d);loaded=true;}}}catch(e){}
  document.getElementById('syncHint').textContent=loaded?'已加载线上数据':'本地预览模式（上传 data.json 后自动同步）';
  if(isAdmin){
    document.getElementById('adminBtn').style.display='none';
    document.getElementById('logoutBtn').style.display='inline';
    document.getElementById('adminStatus').textContent='管理员模式已开启';
  }else{
    document.getElementById('adminBtn').style.display='inline';
    document.getElementById('logoutBtn').style.display='none';
  }
  renderTabs();render();
}

function renderTabs(){
  const el=document.getElementById('tabs');
  let h=`<div class="tab ${tab==='全部'?'active':''}" onclick="tab='全部';renderTabs();render()">全部 (${CARS.length})</div>`;
  SERIES.forEach(s=>{const c=CARS.filter(x=>x.series===s).length;h+=`<div class="tab ${tab===s?'active':''}" onclick="tab='${s}';renderTabs();render()">${s} (${c})</div>`});
  if(isAdmin){
    h+=`<div class="tab add" onclick="addSeries()">+ 系列</div>`;
    h+=`<div class="tools"><button class="btn btn-pink" onclick="openModal(-1)">+ 添加车辆</button><button class="btn btn-out" onclick="exportJSON()">导出 JSON</button></div>`;
  }
  el.innerHTML=h;
}

function render(){
  const kw=document.getElementById('kw').value.toLowerCase().trim();
  let list=CARS.filter(d=>{
    if(tab!=='全部'&&d.series!==tab) return false;
    if(kw&&! [d.name,d.series,d.factory,d.spec,d.status,d.note].filter(Boolean).join(' ').toLowerCase().includes(kw)) return false;
    return true;
  });
  document.getElementById('sCars').textContent=list.length;
  const el=document.getElementById('list');
  if(!list.length){el.innerHTML='<div class="empty">没有找到匹配的车次</div>';return;}
  el.innerHTML=list.map((d,i)=>{
    const realIndex=CARS.indexOf(d);
    const cs=(d.crafts&&d.crafts.length)?d.crafts:[{name:d.spec||'—',qty:d.qty||0,avg:0,ship:0}];
    const tq=cs.reduce((s,c)=>s+(+c.qty||0),0);
    const am=d.mode==='人头'?'人头摊':'个数摊';
    let rows=cs.map(c=>`<tr><td style="text-align:left">${c.name}</td><td>${+c.qty||0}</td><td>¥${(+c.avg||0).toFixed(2)}</td><td>¥${(+c.ship||0).toFixed(2)}</td><td>¥${((+c.avg||0)+(+c.ship||0)).toFixed(2)}</td></tr>`).join('');
    let imgHtml='';
    if(d.images&&d.images.length){
      if(d.images.length===1) imgHtml=`<div class="img-box"><img src="${d.images[0]}" alt="打样图" onerror="this.parentElement.style.display='none'"></div>`;
      else imgHtml=`<div class="img-box"><div class="img-row">${d.images.map(u=>`<img src="${u}" alt="打样图" onerror="this.style.display='none'">`).join('')}</div></div>`;
    }
    const actHtml=isAdmin?`<div class="actions"><button class="btn-edit" onclick="openModal(${realIndex})">编辑</button><button class="btn-del" onclick="delCar(${realIndex})">删除</button></div>`:'';
    return `<div class="card"><div class="badge">${tq} 枚</div>
      <div class="card-head"><h3>${realIndex+1}. ${d.name} <span class="tag">${d.series||''}</span></h3>${d.status?`<span class="tag">${d.status}</span>`:''}</div>
      ${imgHtml}
      <div class="meta"><b>成团→完成：</b>${d.payDate||'—'} → ${d.finishDate||'—'}</div>
      ${d.factory?`<div class="info"><b>工厂：</b>${d.factory}</div>`:''}
      ${d.spec?`<div class="info"><b>工艺：</b>${d.spec}</div>`:''}
      <table><thead><tr><th>工艺</th><th>售出</th><th>均摊(${am})</th><th>大货</th><th>单件</th></tr></thead><tbody>${rows}</tbody><tfoot><tr><td style="text-align:left">合计</td><td>${tq}</td><td colspan="3"></td></tr></tfoot></table>
      ${(d.moldFee||d.artFee)?`<div class="foot">模具打样 ¥${+d.moldFee||0} + 稿费 ¥${+d.artFee||0}</div>`:''}
      ${d.note?`<div class="foot" style="margin-left:8px">备注：${d.note}</div>`:''}
      ${actHtml}
    </div>`}).join('');
}

function addSeries(){const n=prompt('新系列名称：');if(n&&n.trim()&&!SERIES.includes(n.trim())){SERIES.unshift(n.trim());refreshLocal();renderTabs();render()}}

function openModal(idx){
  editIndex=(typeof idx==='number'&&idx>=0)?idx:-1;
  document.getElementById('modalTitle').textContent=editIndex>=0?'编辑车辆':'添加新车';
  document.getElementById('modal').classList.add('show');
  document.getElementById('dlSeries').innerHTML=SERIES.map(s=>`<option value="${s}">`).join('');
  if(editIndex>=0){
    const c=CARS[editIndex];
    document.getElementById('fSeries').value=c.series||'';
    document.getElementById('fStatus').value=c.status||'未开始';
    document.getElementById('fName').value=c.name||'';
    document.getElementById('fFactory').value=c.factory||'';
    document.getElementById('fMode').value=c.mode||'个数';
    document.getElementById('fPay').value=c.payDate||'';
    document.getElementById('fFinish').value=c.finishDate||'';
    document.getElementById('fSpec').value=c.spec||'';
    document.getElementById('fImg').value=(c.images||[]).join('\n');
    document.getElementById('fMold').value=c.moldFee||0;
    document.getElementById('fArt').value=c.artFee||0;
    document.getElementById('fNote').value=c.note||'';
    document.getElementById('fCrafts').innerHTML='';
    (c.crafts||[]).forEach(cft=>{addCraftRow(cft)});
    if(!document.getElementById('fCrafts').children.length) addCraftRow();
  }else{
    document.getElementById('fSeries').value='';
    document.getElementById('fStatus').value='未开始';
    ['fName','fFactory','fPay','fFinish','fSpec','fImg','fNote'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('fMold').value=0;document.getElementById('fArt').value=0;
    document.getElementById('fCrafts').innerHTML='';addCraftRow();addCraftRow();
  }
}
function closeModal(){document.getElementById('modal').classList.remove('show');editIndex=-1}
function addCraftRow(data){
  const d=document.createElement('div');d.className='craft-row';
  d.innerHTML=`<input placeholder="工艺名" style="flex:2" value="${data?data.name:''}"><input placeholder="售出" type="number" style="flex:1" value="${data?data.qty:''}"><input placeholder="均摊" type="number" step="0.1" style="flex:1" value="${data?data.avg:''}"><input placeholder="大货" type="number" step="0.1" style="flex:1" value="${data?data.ship:''}"><button class="del" onclick="this.parentElement.remove()">×</button>`;
  document.getElementById('fCrafts').appendChild(d);
}

function saveCar(){
  const name=document.getElementById('fName').value.trim();if(!name){alert('车名不能空');return}
  let series=document.getElementById('fSeries').value.trim();if(!series) series='其他';
  series=series.replace(/\s+/g,'');
  if(!SERIES.includes(series)) SERIES.unshift(series);
  const imgs=document.getElementById('fImg').value.trim().split('\n').map(s=>s.trim()).filter(Boolean);
  const crafts=[];
  document.querySelectorAll('#fCrafts .craft-row').forEach(r=>{const ins=r.querySelectorAll('input'),nm=ins[0].value.trim();if(nm)crafts.push({name:nm,qty:+ins[1].value||0,avg:+ins[2].value||0,ship:+ins[3].value||0})});
  const obj={series,name,status:document.getElementById('fStatus').value,factory:document.getElementById('fFactory').value.trim(),mode:document.getElementById('fMode').value,payDate:document.getElementById('fPay').value.trim(),finishDate:document.getElementById('fFinish').value.trim(),spec:document.getElementById('fSpec').value.trim(),images:imgs,moldFee:+document.getElementById('fMold').value||0,artFee:+document.getElementById('fArt').value||0,note:document.getElementById('fNote').value.trim(),crafts};
  if(editIndex>=0){CARS[editIndex]=obj}else{CARS.push(obj)}
  refreshLocal();closeModal();if(isAdmin){
    document.getElementById('adminBtn').style.display='none';
    document.getElementById('logoutBtn').style.display='inline';
    document.getElementById('adminStatus').textContent='管理员模式已开启';
  }else{
    document.getElementById('adminBtn').style.display='inline';
    document.getElementById('logoutBtn').style.display='none';
  }
  renderTabs();render();
}

function delCar(idx){
  if(!confirm('确定删除「'+CARS[idx].name+'」？\n删除后记得导出 JSON 并上传到仓库。')) return;
  CARS.splice(idx,1);refreshLocal();if(isAdmin){
    document.getElementById('adminBtn').style.display='none';
    document.getElementById('logoutBtn').style.display='inline';
    document.getElementById('adminStatus').textContent='管理员模式已开启';
  }else{
    document.getElementById('adminBtn').style.display='inline';
    document.getElementById('logoutBtn').style.display='none';
  }
  renderTabs();render();
}

function refreshLocal(){localStorage.setItem('kc_draft',JSON.stringify({series:SERIES,cars:CARS}))}
(function loadDraft(){try{const d=JSON.parse(localStorage.getItem('kc_draft'));if(d&&d.cars&&confirm('检测到上次未导出的草稿，要恢复吗？'))apply(d)}catch(e){}})();
function exportJSON(){
  const blob=new Blob([JSON.stringify({series:SERIES,cars:CARS},null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='data.json';a.click();
  alert('已下载 data.json\n拖进 GitHub 仓库覆盖原文件，1分钟后所有人看到更新。');
}
document.getElementById('kw').addEventListener('input',render);
function promptPassword(){
  const pwd = prompt('请输入管理员密码：');
  if(pwd === 'ztt0919'){
    isAdmin = true;
    sessionStorage.setItem('kc_admin','true');
    document.getElementById('adminBtn').style.display='none';
    document.getElementById('logoutBtn').style.display='inline';
    document.getElementById('adminStatus').textContent='管理员模式已开启';
    renderTabs();render();
    alert('管理员登录成功！现在可以添加/编辑/删除车辆了。');
  }else if(pwd !== null){
    alert('密码错误，无法进入管理员模式。');
  }
}
function logoutAdmin(){
  isAdmin = false;
  sessionStorage.removeItem('kc_admin');
  document.getElementById('adminBtn').style.display='inline';
  document.getElementById('logoutBtn').style.display='none';
  document.getElementById('adminStatus').textContent='';
  renderTabs();render();
}
init();
</script>
</body>
</html>
